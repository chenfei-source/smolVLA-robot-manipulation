# smolVLA Robot Manipulation Configuration

robot:
  name: Piper
  type: 6-DoF robotic arm

dataset:
  framework: LeRobot
  root: /root/piper_record_test
  episodes: 105
  frames: 27623
  fps: 15

  observations:
    - observation.images.camera1
    - observation.images.camera2
    - robot_state

  actions:
    - joint_positions
    - gripper_action


policy:
  name: smolVLA
  pretrained_path: smolvla_base


training:
  framework: LeRobot
  command: lerobot-train

  batch_size: 16
  steps: 50000
  save_frequency: 10000


hardware:
  accelerator: CUDA
